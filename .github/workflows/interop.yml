name: EDF and BDF interoperability
on: [push, pull_request]
permissions:
  contents: read

jobs:
  compare:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the vcpkg manifest baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 4702e381dbbd9b54d3f7e1eb565cd8981c1814cd
          path: vcpkg-src
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $root = (Resolve-Path vcpkg-src).Path
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          if ($IsWindows) { & "$root/bootstrap-vcpkg.bat" -disableMetrics }
          else { & "$root/bootstrap-vcpkg.sh" -disableMetrics }
          exit $LASTEXITCODE
      - run: cmake --preset dev
      - run: cmake --build --preset dev --parallel 2
      - run: ctest --preset dev

  mne:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.76.2
          environments: mne
          locked: true
      - run: pixi run --locked -e mne test-mne
      - run: pixi run --locked -e mne test-binding
